name: Deploy to Minikube using GitHub Actions

on: [push]

jobs:
  job1:
    runs-on: ubuntu-latest
    name: build Node.js Docker Image and deploy to minikube

    steps:
      - uses: actions/checkout@v2

      - name: Start minikube
        uses: medyagh/setup-minikube@master
        with:
          container-runtime: docker

      - name: Try the cluster
        run: kubectl get pods -A

      - name: Build image
        run: |
          export SHELL=/bin/bash
          eval $(minikube -p minikube docker-env)
          docker build -f ./Dockerfile -t devopshint/node-app:latest .
          echo -n "verifying images:"
          docker images

      - name: Deploy to minikube
        run: kubectl apply -f k8s-node-app.yaml
          
      - name: Debug Kubernetes deployment
        run: |
          echo "===== POD STATUS ====="
          kubectl get pods -o wide

          echo "===== DEPLOYMENT STATUS ====="
          kubectl get deployments

          echo "===== POD DETAILS ====="
          kubectl describe pods -l app=nodejs-app

          echo "===== APPLICATION LOGS ====="
          kubectl logs -l app=nodejs-app --all-containers=true --tail=100 || true

          echo "===== KUBERNETES EVENTS ====="
          kubectl get events --sort-by=.metadata.creationTimestamp

      - name: Test service URLs
        run: |
          minikube service list
          minikube service nodejs-app --url
